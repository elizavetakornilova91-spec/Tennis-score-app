  }

  }

    gap: 24px;
    flex-wrap: wrap;
    padding: 32px 28px;
    border-radius: calc(var(--radius) + 4px);
    border: 1px solid var(--primary);
    @supports (color: color-mix(in lab, red, red)) {
      border: 1px solid color-mix(in oklab, var(--primary) 30%, var(--border));
    }
    background: radial-gradient(circle at 15% 50%, var(--primary), transparent 55%), linear-gradient(120deg, var(--primary), var(--card) 70%);
    @supports (color: color-mix(in lab, red, red)) {
      background: radial-gradient(circle at 15% 50%, color-mix(in oklab, var(--primary) 28%, transparent), transparent 55%), linear-gradient(120deg, color-mix(in oklab, var(--primary) 14%, var(--card)), var(--card) 70%);
    }
  }
  .tour-banner-lines {

      filter: drop-shadow(0 0 18px color-mix(in oklab, var(--primary) 45%, transparent));
    }

  }
  .tour-banner-meta {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .serve-slot {
    width: 12px;
    display: inline-flex;
    justify-content: center;
  }
  .serve-ball {
    width: 10px;
    height: 10px;
    border-radius: 9999px;
    background: var(--live);
    box-shadow: 0 0 8px var(--live);
  }
  .point-box {
    min-width: 32px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: .85rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    background: var(--live);
    @supports (color: color-mix(in lab, red, red)) {
      background: color-mix(in oklab, var(--live) 20%, var(--muted));
    }
    color: var(--live);
  }
  .fade-in {
    animation: fade-in .35s ease both;
  }
}
